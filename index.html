<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanishta Varman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a0a10;
            color: #f5d5e0;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background: rgba(26, 10, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(232, 128, 154, 0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #E8809A;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #f5d5e0;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            font-weight: 300;
        }

        .nav-links a:hover {
            color: #E8809A;
        }

        /* Hero Section */
        .hero {
            min-height: calc(100vh - 80px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 4rem;
            padding: 4rem 5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            line-height: 1.1;
            margin-bottom: 2rem;
            color: #f5d5e0;
            font-weight: 400;
        }

        .hero-text h1 em {
            font-style: italic;
            color: #E8809A;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: rgba(245, 213, 224, 0.7);
            margin-bottom: 2.5rem;
            line-height: 1.8;
            font-weight: 300;
        }

        .cta-button {
            display: inline-block;
            background: #E8809A;
            color: #1a0a10;
            padding: 1rem 2.5rem;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 2px solid #E8809A;
        }

        .cta-button:hover {
            background: transparent;
            color: #E8809A;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(232, 128, 154, 0.3);
        }

        .hero-image {
            height: 500px;
            background: linear-gradient(135deg, #2d1520 0%, #1a0a10 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(232, 128, 154, 0.3);
            font-size: 1rem;
            border: 1px solid rgba(232, 128, 154, 0.2);
        }

        /* Sections Grid */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
        }

        .section-tile {
            aspect-ratio: 4/3;
            display: flex;
            align-items: flex-end;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
        }

        .section-tile::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
            z-index: 1;
        }

        .section-tile h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: white;
            position: relative;
            z-index: 2;
            font-weight: 400;
        }

        .section-tile:hover {
            transform: scale(1.02);
        }

        .tile-1 { background: #C05070; }
        .tile-2 { background: #E8809A; }
        .tile-3 { background: #2d1520; }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(26, 10, 16, 0.5);
            color: rgba(245, 213, 224, 0.5);
            font-size: 0.85rem;
            margin-top: 4rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1.5rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1.5rem;
            }

            .hero {
                grid-template-columns: 1fr;
                padding: 3rem 2rem;
                gap: 2rem;
            }

            .hero-text h1 {
                font-size: 3rem;
            }

            .hero-image {
                height: 300px;
            }

            .sections-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">T · V</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h1>Build.<br><em>Create.</em><br>Explore.</h1>
            <p>Computer Science student passionate about AI, security, and building meaningful digital experiences.</p>
            <a href="projects.html" class="cta-button">View Projects</a>
        </div>
        <div class="hero-image">
            [ your image here ]
        </div>
    </section>

    <!-- Sections Grid -->
    <div class="sections-grid">
        <a href="about.html" class="section-tile tile-1">
            <h3>About Me</h3>
        </a>
        <a href="projects.html" class="section-tile tile-2">
            <h3>Projects</h3>
        </a>
        <a href="skills.html" class="section-tile tile-3">
            <h3>Skills & Certs</h3>
        </a>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Tanishta Varman</p>
    </footer>
</body>
</html>
